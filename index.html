<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자기소개</title>
<style>
  :root { --fg:#1f2328; --muted:#57606a; --bg:#ffffff; --line:#d0d7de; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg:#e6edf3; --muted:#9198a1; --bg:#0d1117; --line:#30363d; --accent:#4493f8; }
  }
  :root[data-theme="dark"] { --fg:#e6edf3; --muted:#9198a1; --bg:#0d1117; --line:#30363d; --accent:#4493f8; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Malgun Gothic", system-ui, sans-serif; line-height:1.7; }
  main { max-width:720px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  h2 { font-size:18px; border-bottom:1px solid var(--line); padding-bottom:6px; margin-top:32px; color:var(--accent); }
  ul { padding-left:20px; }
  li { margin:6px 0; }
  .note { color:var(--muted); font-size:14px; margin-top:40px; border-top:1px solid var(--line); padding-top:12px; }
</style>
</head>
<body>
<main>
  <h1>자기소개</h1>
  <p class="sub">제약 업계 프로젝트 관리 경력 · 의약품 허가 분야 지원 준비 중</p>

  <h2>경력</h2>
  <ul>
    <li>제약회사에서 프로젝트 관리 업무를 2년간 수행했습니다.</li>
  </ul>

  <h2>하고 싶은 일</h2>
  <ul>
    <li>의약품 개발 과정 이해와 관리</li>
    <li>출품 관리</li>
    <li>인허가 업무 수행</li>
  </ul>

  <p class="note">이 페이지는 초안입니다. 회사명, 연락처, 세부 성과는 공개 전에 본인이 확인하고 추가 여부를 정해 주세요.</p>
</main>
</body>
</html>
